<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Constellation</title>
    <style>
        body {
            margin: 0;
            background: #000005;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }
        canvas { display: block; }
        
        /* Progress HUD */
        #progress-hud {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(76, 139, 245, 0.3);
            color: white;
            min-width: 200px;
        }
        #progress-hud h3 {
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #4c8bf5, #d367c1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }
        .stat-value {
            color: #4c8bf5;
            font-weight: bold;
        }
        
        /* Node info tooltip */
        #node-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(76, 139, 245, 0.5);
            color: white;
            pointer-events: none;
            display: none;
            z-index: 100;
        }
        
        /* Legend */
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(76, 139, 245, 0.3);
            color: white;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <!-- Progress HUD -->
    <div id="progress-hud">
        <h3>Your Constellation</h3>
        <div class="stat">
            <span>Completed:</span>
            <span class="stat-value" id="completed-count">0/14</span>
        </div>
        <div class="stat">
            <span>Streak:</span>
            <span class="stat-value" id="streak-count">0 days</span>
        </div>
        <div class="stat">
            <span>Progress:</span>
            <span class="stat-value" id="progress-percent">0%</span>
        </div>
    </div>
    
    <!-- Node Tooltip -->
    <div id="node-tooltip"></div>
    
    <!-- Legend -->
    <div id="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background: #4caf50; box-shadow: 0 0 10px #4caf50;"></div>
            <span>Completed</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #ffd700; box-shadow: 0 0 10px #ffd700;"></div>
            <span>In Progress</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: #4c8bf5;"></div>
            <span>Not Started</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Initialize Supabase (will use parent window's client if available)
        let supabase = window.parent.supabase;
        let currentUser = null;
        let userProgress = {};
        let nodeStats = {};
        
        // Node data
        const nodes = [
            { id: 'CLH', group: 4, val: 100, name: 'CLH HUB' },
            { id: 'React', group: 1, val: 30, name: 'React.js' },
            { id: 'HTML', group: 1, val: 20, name: 'HTML5' },
            { id: 'CSS', group: 1, val: 20, name: 'CSS3' },
            { id: 'JS', group: 1, val: 30, name: 'JavaScript' },
            { id: 'NextJS', group: 1, val: 20, name: 'Next.js' },
            { id: 'TS', group: 1, val: 20, name: 'TypeScript' },
            { id: 'LLM', group: 2, val: 30, name: 'LLMs' },
            { id: 'Prompting', group: 2, val: 20, name: 'Prompting' },
            { id: 'Agents', group: 2, val: 25, name: 'AI Agents' },
            { id: 'Python', group: 2, val: 20, name: 'Python' },
            { id: 'Figma', group: 3, val: 20, name: 'Figma' },
            { id: 'UI', group: 3, val: 20, name: 'UI/UX' },
            { id: 'A11y', group: 3, val: 15, name: 'Accessibility' }
        ];

        const links = [
            ['CLH', 'React'], ['CLH', 'LLM'], ['CLH', 'UI'],
            ['React', 'JS'], ['React', 'NextJS'], ['JS', 'TS'],
            ['HTML', 'CSS'], ['CSS', 'UI'],
            ['LLM', 'Agents'], ['LLM', 'Prompting'], ['LLM', 'Python'],
            ['Python', 'JS'], ['UI', 'Figma'], ['UI', 'A11y']
        ];

        // Colors based on status
        const baseColors = {
            1: 0x4c8bf5, // WEB - blue
            2: 0xd367c1, // AI - pink
            3: 0xa060ff, // DESIGN - purple
            4: 0xffffff  // COMMUNITY - white
        };

        // Status colors
        const statusColors = {
            completed: 0x4caf50,    // Green
            in_progress: 0xffd700,   // Gold
            not_started: null        // Use base color
        };

        // Scene setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000005);

        const nodeGroup = new THREE.Group();
        const nodeLookup = {};
        const nodeMeshes = {}; // Store sphere meshes for updates

        // Load user progress
        async function loadUserProgress() {
            if (!supabase) return;
            
            try {
                const { data: { user } } = await supabase.auth.getUser();
                currentUser = user;
                
                if (user) {
                    // Load user progress
                    const { data: progress } = await supabase
                        .from('user_progress')
                        .select('*')
                        .eq('user_id', user.id);
                    
                    if (progress) {
                        progress.forEach(p => {
                            userProgress[p.node_id] = p.status;
                        });
                    }
                    
                    // Load streak
                    const { data: streak } = await supabase
                        .from('learning_streaks')
                        .select('*')
                        .eq('user_id', user.id)
                        .single();
                    
                    if (streak) {
                        updateHUD(streak);
                    }
                }
                
                // Load community stats
                const { data: stats } = await supabase
                    .from('node_stats')
                    .select('*');
                
                if (stats) {
                    stats.forEach(s => {
                        nodeStats[s.node_id] = s;
                    });
                }
                
                // Rebuild nodes with progress colors
                buildGalaxy();
                
            } catch (error) {
                console.error('Error loading progress:', error);
                buildGalaxy(); // Build anyway
            }
        }

        function getNodeStatus(nodeId) {
            return userProgress[nodeId] || 'not_started';
        }

        function getNodeColor(node) {
            const status = getNodeStatus(node.id);
            const statusColor = statusColors[status];
            
            if (statusColor !== null) {
                return new THREE.Color(statusColor);
            }
            return new THREE.Color(baseColors[node.group]);
        }

        function getNodeIntensity(node) {
            const status = getNodeStatus(node.id);
            if (status === 'completed') return 1.5; // Brighter
            if (status === 'in_progress') return 1.2;
            return 0.6; // Dimmer for not started
        }

        function buildGalaxy() {
            // Clear existing nodes
            nodeGroup.clear();
            
            // Create nodes
            nodes.forEach((node, i) => {
                // Position in a sphere
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 150;
                node.x = r * Math.sin(phi) * Math.cos(theta);
                node.y = r * Math.sin(phi) * Math.sin(theta);
                node.z = r * Math.cos(phi);

                const group = new THREE.Group();
                const radius = Math.cbrt(node.val) * 1.5;
                const color = getNodeColor(node);
                const intensity = getNodeIntensity(node);

                // Sphere with glow effect
                const sphereGeo = new THREE.SphereGeometry(radius, 32, 32);
                const sphereMat = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.9
                });
                const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                group.add(sphere);
                nodeMeshes[node.id] = sphere;

                // Outer glow for completed/in-progress nodes
                const status = getNodeStatus(node.id);
                if (status !== 'not_started') {
                    const glowGeo = new THREE.SphereGeometry(radius * 1.3, 32, 32);
                    const glowMat = new THREE.MeshBasicMaterial({
                        color: color,
                        transparent: true,
                        opacity: status === 'completed' ? 0.4 : 0.3,
                        side: THREE.BackSide
                    });
                    const glow = new THREE.Mesh(glowGeo, glowMat);
                    group.add(glow);
                }

                // Text label
                const canvas2d = document.createElement('canvas');
                canvas2d.width = 2048;
                canvas2d.height = 512;
                const ctx = canvas2d.getContext('2d');
                ctx.font = 'Bold 120px Arial, sans-serif';
                ctx.fillStyle = 'white';
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 4;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeText(node.name, 1024, 256);
                ctx.fillText(node.name, 1024, 256);

                const texture = new THREE.Texture(canvas2d);
                texture.needsUpdate = true;

                const spriteMat = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true,
                    depthTest: false
                });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(150, 37.5, 1);
                sprite.position.y = radius + 20;
                group.add(sprite);

                group.position.set(node.x, node.y, node.z);
                nodeGroup.add(group);
                nodeLookup[node.id] = group;
            });
            
            scene.add(nodeGroup);
        }

        // Create links
        const linkGroup = new THREE.Group();
        links.forEach(([source, target]) => {
            const sourceNode = nodes.find(n => n.id === source);
            const targetNode = nodes.find(n => n.id === target);

            const points = [
                new THREE.Vector3(sourceNode.x, sourceNode.y, sourceNode.z),
                new THREE.Vector3(targetNode.x, targetNode.y, targetNode.z)
            ];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0x334466, transparent: true, opacity: 0.3 });
            const line = new THREE.Line(geometry, material);
            linkGroup.add(line);
        });
        scene.add(linkGroup);

        // Starfield
        const starGeo = new THREE.BufferGeometry();
        const starVerts = [];
        for (let i = 0; i < 2000; i++) {
            starVerts.push(
                (Math.random() - 0.5) * 2000,
                (Math.random() - 0.5) * 2000,
                (Math.random() - 0.5) * 2000
            );
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2 });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Update HUD
        function updateHUD(streak) {
            const completed = Object.values(userProgress).filter(s => s === 'completed').length;
            const total = nodes.length;
            const percent = Math.round((completed / total) * 100);
            
            document.getElementById('completed-count').textContent = `${completed}/${total}`;
            document.getElementById('streak-count').textContent = `${streak.current_streak} days`;
            document.getElementById('progress-percent').textContent = `${percent}%`;
        }

        // Animation
        let angle = 0;
        function animate() {
            requestAnimationFrame(animate);

            angle += 0.001;
            camera.position.x = 400 * Math.sin(angle);
            camera.position.z = 400 * Math.cos(angle);
            camera.lookAt(0, 0, 0);

            nodeGroup.rotation.y += 0.0005;

            renderer.render(scene, camera);
        }

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        loadUserProgress();
        animate();
    </script>
</body>
</html>
