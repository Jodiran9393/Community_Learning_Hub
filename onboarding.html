<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Learning Path - Community Learning Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: white;
        }

        .onboarding-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .onboarding-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .onboarding-header h1 {
            font-size: 48px;
            font-weight: 700;
            margin: 0 0 20px 0;
            background: linear-gradient(90deg, #4c8bf5, #d367c1, #7CFF6E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .onboarding-header p {
            font-size: 20px;
            color: #b8b9d6;
            margin: 0;
            line-height: 1.6;
        }

        .track-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .track-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .track-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--track-gradient);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .track-card:hover::before {
            transform: scaleX(1);
        }

        .track-card:hover {
            transform: translateY(-8px);
            border-color: var(--track-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 40px var(--track-glow);
        }

        .track-card.selected {
            border-color: var(--track-color);
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-4px);
        }

        .track-card.selected::before {
            transform: scaleX(1);
        }

        .track-icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: block;
        }

        .track-title {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: white;
        }

        .track-description {
            font-size: 16px;
            color: #b8b9d6;
            margin: 0 0 24px 0;
            line-height: 1.6;
        }

        .track-stats {
            display: flex;
            gap: 20px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .track-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #b8b9d6;
        }

        .track-stat-icon {
            font-size: 18px;
        }

        /* Track-specific colors */
        .track-card[data-track="Frontend_Web_Dev"] {
            --track-color: #4c8bf5;
            --track-gradient: linear-gradient(90deg, #4c8bf5, #5fa3ff);
            --track-glow: rgba(76, 139, 245, 0.3);
        }

        .track-card[data-track="AI_LLMs_Builder_Agents"] {
            --track-color: #7CFF6E;
            --track-gradient: linear-gradient(90deg, #7CFF6E, #a0ff94);
            --track-glow: rgba(124, 255, 110, 0.3);
        }

        .track-card[data-track="Data_Analytics"] {
            --track-color: #FFD56E;
            --track-gradient: linear-gradient(90deg, #FFD56E, #ffe494);
            --track-glow: rgba(255, 213, 110, 0.3);
        }

        .continue-btn {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 40px auto 0;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(90deg, #4c8bf5, #d367c1);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0;
            pointer-events: none;
        }

        .continue-btn.visible {
            opacity: 1;
            pointer-events: all;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(76, 139, 245, 0.4);
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4c8bf5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            text-align: center;
            padding: 100px 20px;
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            .onboarding-header h1 {
                font-size: 36px;
            }

            .track-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="onboarding-container">
        <div class="onboarding-header">
            <h1>Choose Your Learning Path</h1>
            <p>Select the domain you want to master and we'll personalize your journey</p>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Loading learning tracks...</p>
        </div>

        <div id="error" class="error" style="display: none;">
            <p>❌ Failed to load tracks. Please refresh the page.</p>
        </div>

        <div id="track-selector" class="track-selector" style="display: none;">
            <!-- Dynamically populated -->
        </div>

        <button id="continue-btn" class="continue-btn">
            Continue to Assessment →
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/track-loader.js"></script>
    <script>
        let selectedTrack = null;

        // Track metadata for display
        const trackMeta = {
            'Frontend_Web_Dev': {
                icon: '🌐',
                title: 'Frontend Web Development',
                description: 'Build responsive websites, interactive apps, and modern React applications',
                topics: 23
            },
            'AI_LLMs_Builder_Agents': {
                icon: '🤖',
                title: 'AI & Large Language Models',
                description: 'Build intelligent agents, RAG apps, and fine-tune models with best practices',
                topics: 26
            },
            'Data_Analytics': {
                icon: '📊',
                title: 'Data Analytics',
                description: 'Master Excel, SQL, Python, and BI tools for data-driven insights',
                topics: 25
            }
        };

        async function init() {
            try {
                // Load all tracks
                const tracks = await window.trackLoader.loadAllTracks();

                // Hide loading, show selector
                document.getElementById('loading').style.display = 'none';
                document.getElementById('track-selector').style.display = 'grid';

                // Render track cards
                renderTrackCards(tracks);

            } catch (error) {
                console.error('Initialization error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        }

        function renderTrackCards(tracks) {
            const container = document.getElementById('track-selector');
            const trackIds = ['Frontend_Web_Dev', 'AI_LLMs_Builder_Agents', 'Data_Analytics'];

            trackIds.forEach(trackId => {
                const meta = trackMeta[trackId];
                const trackData = tracks[trackId.toLowerCase().replace('_', '')];

                const card = document.createElement('div');
                card.className = 'track-card';
                card.dataset.track = trackId;

                card.innerHTML = `
                    <span class="track-icon">${meta.icon}</span>
                    <h3 class="track-title">${meta.title}</h3>
                    <p class="track-description">${meta.description}</p>
                    <div class="track-stats">
                        <div class="track-stat">
                            <span class="track-stat-icon">📚</span>
                            <span>${meta.topics} Topics</span>
                        </div>
                        <div class="track-stat">
                            <span class="track-stat-icon">🎯</span>
                            <span>3 Outcomes</span>
                        </div>
                        <div class="track-stat">
                            <span class="track-stat-icon">⏱️</span>
                            <span>~10 min assessment</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => selectTrack(trackId, card));
                container.appendChild(card);
            });
        }

        function selectTrack(trackId, cardElement) {
            // Remove previous selection
            document.querySelectorAll('.track-card').forEach(card => {
                card.classList.remove('selected');
            });

            // Add selection
            cardElement.classList.add('selected');
            selectedTrack = trackId;

            // Show continue button
            const btn = document.getElementById('continue-btn');
            btn.classList.add('visible');
        }

        // Continue button handler
        document.getElementById('continue-btn').addEventListener('click', () => {
            if (!selectedTrack) return;

            // Save selection to localStorage
            localStorage.setItem('clh_selected_track', selectedTrack);

            // Redirect to outcome selection (next step)
            window.location.href = `/outcome-selector.html?track=${selectedTrack}`;
        });

        // Initialize on page load
        init();
    </script>
</body>

</html>
