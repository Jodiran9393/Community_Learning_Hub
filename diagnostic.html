<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Assessment - Community Learning Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .diagnostic-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-bottom: 40px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4c8bf5, #d367c1);
            width: 33%;
            transition: width 0.3s ease;
        }

        .step-indicator {
            text-align: center;
            margin-bottom: 40px;
            font-size: 14px;
            color: #b8b9d6;
        }

        .diagnostic-step h2 {
            font-size: 32px;
            margin: 0 0 12px 0;
        }

        .step-description {
            color: #b8b9d6;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .sliders-container {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .confidence-slider {
            background: rgba(255, 255, 255, 0.05);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider-label {
            display: block;
            font-size: 16px;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .slider-track {
            position: relative;
        }

        .slider-input {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #4c8bf5;
            border-radius: 50%;
            cursor: pointer;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #7a7b9d;
            margin-top: 8px;
        }

        .slider-value {
            position: absolute;
            right: 0;
            top: -30px;
            font-size: 20px;
            font-weight: 600;
            color: #4c8bf5;
        }

        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .quiz-question {
            background: rgba(255, 255, 255, 0.05);
            padding: 28px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .question-number {
            font-size: 12px;
            color: #7a7b9d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 18px;
            margin: 0 0 20px 0;
            line-height: 1.5;
        }

        .question-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background: rgba(76, 139, 245, 0.1);
            border-color: rgba(76, 139, 245, 0.3);
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
        }

        .option-label input[type="radio"]:checked+.option-text {
            color: #4c8bf5;
            font-weight: 600;
        }

        .nav-buttons {
            display: flex;
            gap: 16px;
            margin-top: 40px;
        }

        .nav-btn {
            flex: 1;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-btn-primary {
            background: linear-gradient(90deg, #4c8bf5, #d367c1);
            color: white;
        }

        .nav-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #step-1 {
            display: block;
        }

        #step-2,
        #step-3 {
            display: none;
        }
    </style>
</head>

<body>
    <div class="diagnostic-container">
        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div id="step-indicator" class="step-indicator">Step 1 of 3: Confidence Assessment</div>

        <div id="step-1"></div>
        <div id="step-2"></div>
        <div id="step-3"></div>

        <div class="nav-buttons">
            <button id="prev-btn" class="nav-btn nav-btn-secondary" style="display: none;">
                ← Previous
            </button>
            <button id="next-btn" class="nav-btn nav-btn-primary">
                Next Step →
            </button>
            <button id="finish-btn" class="nav-btn nav-btn-primary" style="display: none;">
                Calculate My Path →
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="/js/track-loader.js"></script>
    <script src="/js/diagnostic-engine.js"></script>
    <script>
        let engine;
        let currentStep = 1;

        async function init() {
            // Get track and outcome from URL
            const params = new URLSearchParams(window.location.search);
            const trackId = params.get('track');
            const outcomeId = params.get('outcome');

            if (!trackId || !outcomeId) {
                window.location.href = '/onboarding.html';
                return;
            }

            // Load track data
            const track = await window.trackLoader.getTrack(trackId);

            // Initialize diagnostic engine
            engine = new window.DiagnosticEngine(track, outcomeId);

            // Render step 1
            engine.renderConfidenceSliders(document.getElementById('step-1'));
        }

        function updateProgress() {
            const progress = (currentStep / 3) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('step-indicator').textContent =
                `Step ${currentStep} of 3: ${getStepLabel(currentStep)}`;
        }

        function getStepLabel(step) {
            const labels = {
                1: 'Confidence Assessment',
                2: 'Core Knowledge Check',
                3: 'Outcome-Specific Questions'
            };
            return labels[step];
        }

        function showStep(step) {
            // Hide all steps
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'none';
            document.getElementById('step-3').style.display = 'none';

            // Show current step
            document.getElementById(`step-${step}`).style.display = 'block';

            // Update buttons
            document.getElementById('prev-btn').style.display = step > 1 ? 'block' : 'none';
            document.getElementById('next-btn').style.display = step < 3 ? 'block' : 'none';
            document.getElementById('finish-btn').style.display = step === 3 ? 'block' : 'none';

            updateProgress();
        }

        // Next button
        document.getElementById('next-btn').addEventListener('click', async () => {
            currentStep++;

            if (currentStep === 2) {
                engine.renderCoreQuiz(document.getElementById('step-2'));
            } else if (currentStep === 3) {
                engine.renderOutcomeQuiz(document.getElementById('step-3'));
            }

            showStep(currentStep);
        });

        // Previous button
        document.getElementById('prev-btn').addEventListener('click', () => {
            currentStep--;
            showStep(currentStep);
        });

        // Finish button
        document.getElementById('finish-btn').addEventListener('click', async () => {
            const btn = document.getElementById('finish-btn');
            btn.disabled = true;
            btn.textContent = 'Calculating...';

            try {
                // Calculate placement
                const placement = await engine.calculatePlacement();

                // Save to database (if logged in)
                const session = await window.sb.auth.getSession();
                if (session.data.session) {
                    await engine.saveToDatabase(placement, session.data.session.user.id);
                }

                // Store results and redirect
                localStorage.setItem('clh_assessment_result', JSON.stringify(placement));
                window.location.href = '/assessment-results.html';

            } catch (error) {
                console.error('Calculation failed:', error);
                btn.disabled = false;
                btn.textContent = 'Try Again';
                alert('Failed to calculate placement. Please try again.');
            }
        });

        init();
    </script>
</body>

</html>
